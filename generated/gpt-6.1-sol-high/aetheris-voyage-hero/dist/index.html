<style>
html{scroll-behavior:smooth;background:#000;scroll-padding-top:90px}body{margin:0;background:#000;color:#fff;font-family:Barlow,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a:focus-visible,button:focus-visible{outline:2px solid white;outline-offset:5px}section{isolation:isolate} .liquid-glass {
background: rgba(255,255,255,0.01);
background-blend-mode: luminosity;
backdrop-filter: blur(4px);
-webkit-backdrop-filter: blur(4px);
border: none;
box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
position: relative;
overflow: hidden;
}
.liquid-glass::before {
content: "";
position: absolute; inset: 0;
border-radius: inherit;
padding: 1.4px;
background: linear-gradient(180deg,
rgba(255,255,255,0.45) 0%,
rgba(255,255,255,0.15) 20%,
rgba(255,255,255,0) 40%,
rgba(255,255,255,0) 60%,
rgba(255,255,255,0.15) 80%,
rgba(255,255,255,0.45) 100%);
-webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
-webkit-mask-composite: xor;
mask-composite: exclude;
pointer-events: none;
}
.liquid-glass-strong {
background:rgba(255,255,255,0.01);background-blend-mode:luminosity;
backdrop-filter: blur(50px);-webkit-backdrop-filter:blur(50px);border:none;
box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
position:relative;overflow:hidden;
}
.liquid-glass-strong::before {
content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;
background:linear-gradient(180deg,rgba(255,255,255,0.5) 0%,rgba(255,255,255,0.2) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.2) 80%,rgba(255,255,255,0.5) 100%);
-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.hero{height:100svh;min-height:850px}dialog{padding:0;color:white;background:#000;border:1px solid #ffffff40;border-radius:20px;width:min(960px,94vw)}dialog::backdrop{background:#000b;backdrop-filter:blur(12px)}
@media(max-width:767px){.hero{min-height:844px}.hero-title{font-size:60px;max-width:360px}.hero-content{padding-top:86px}.hero-badge{font-size:11px}.hero-partners{gap:22px}.hero .stat-card{width:164px;padding:18px}.hero-description{max-width:350px}.hero-partners-label{font-size:10px}.capabilities-content{padding-top:96px}.capability-card{min-height:330px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
