<body>
  <main class="phone" aria-label="Coffee Rewards profile">
    <div class="screen">
      <section class="hero" aria-label="Plum Parfait Latte">
        <video autoplay muted loop playsinline preload="auto" poster="/motionsites-results/coffee-rewards/assets/hero-poster.jpg" aria-label="Animated profile portrait">
          <source src="/motionsites-results/coffee-rewards/assets/hero.mp4" type="video/mp4" />

        <div class="hero-shade"></div>
        <nav class="topbar" aria-label="Profile actions">

        </nav>
      </section>
      <section class="identity" aria-label="Profile details">
        <img class="laurel left" src="/motionsites-results/coffee-rewards/assets/images/laurel-left.png" alt="" />
        <img class="laurel right" src="/motionsites-results/coffee-rewards/assets/images/laurel-right.png" alt="" />
        <h1>Dasha</h1>
        <p class="subtitle">Plum Parfait Latte</p>
      </section>
      <div class="achievement-wrap"><button class="glass pill achievements" data-liquid><img src="/motionsites-results/coffee-rewards/assets/images/icon-trophy.png" alt="" />12 achievements</button></div>
      <section class="stats" aria-label="Coffee journey statistics">
        <article class="stat"><img src="/motionsites-results/coffee-rewards/assets/images/coffee.png" alt="Coffee cup" /><span class="number">154</span><span class="stat-label">drinks<br />consumed</span></article>
        <article class="stat"><img src="/motionsites-results/coffee-rewards/assets/images/sandwich.png" alt="Sandwich" /><span class="number">36</span><span class="stat-label">sandwiches<br />eaten</span></article>
        <article class="stat"><img src="/motionsites-results/coffee-rewards/assets/images/cafe.png" alt="Cafe" /><span class="number">12</span><span class="stat-label">cafes<br />visited</span></article>
      </section>
      <section class="favorite" aria-label="Favorite drink">
        <img class="favorite-image" src="/motionsites-results/coffee-rewards/assets/images/latte.png" alt="Latte" />
        <div class="favorite-copy"><span class="eyebrow">Favorite</span><h2>Latte</h2><p>Ordered 73 times</p></div>
