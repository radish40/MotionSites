<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f0f2f7" />
  <title>Community CTA</title>
  <link rel="icon" href="data:," />
  <style>
    /* DM Sans imported from Google Fonts and cached locally; source URLs: assets/google-fonts-source.css. */
    @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url('assets/dm-sans-400.ttf') format('truetype'); }
    @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 500; font-display: swap; src: url('assets/dm-sans-500.ttf') format('truetype'); }
    @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 600; font-display: swap; src: url('assets/dm-sans-600.ttf') format('truetype'); }
    @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 700; font-display: swap; src: url('assets/dm-sans-700.ttf') format('truetype'); }
    @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 800; font-display: swap; src: url('assets/dm-sans-800.ttf') format('truetype'); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #f0f2f7; color: #1e2240; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; }
    .cta-section { width: 100%; padding: 0 32px 48px; }
    .cta-wrapper { position: relative; border-radius: 28px; overflow: hidden; border: 1px solid rgba(13,36,72,.15); background: #d8e5f2; min-height: 220px; max-width: 1150px; margin: 0 auto; }
    .cta-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 1; }
    .cta-content { position: relative; z-index: 1; padding: 40px; max-width: 560px; }
    .cta-content h2 { font-family: 'DM Sans', sans-serif; font-size: 26px; font-weight: 700; color: #08063c; margin-bottom: 12px; line-height: 1.2; letter-spacing: -.015em; }
    .cta-content p { font-size: 13.5px; font-weight: 400; color: #08063c; line-height: 1.65; margin-bottom: 28px; max-width: 400px; }
    .cta-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: 80%; }
    .cta-form input { flex: 1; min-width: 200px; padding: 13px 22px; border-radius: 50px; border: 1px solid rgba(195,210,235,.75); background: rgba(255,255,255,.96); font-family: 'DM Sans', sans-serif; font-size: 13px; color: #08063c; outline: none; box-shadow: 0 1px 5px rgba(100,110,180,.07); transition: box-shadow .2s, border-color .2s; }
    .cta-form input::placeholder { color: #b2bbd4; font-weight: 400; }
    .cta-form input:focus { border-color: rgba(130,155,220,.65); box-shadow: 0 1px 10px rgba(100,120,210,.16); }
    .cta-form button { padding: 13px 24px; border-radius: 50px; border: none; background: #f8f9fc; color: #08063c; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; letter-spacing: .01em; box-shadow: 0 2px 10px rgba(100,110,180,.15); transition: background .2s, transform .15s, box-shadow .2s; }
    .cta-form button:hover { background: #eef0f5; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(100,110,180,.25); }
    .cta-form button:active { transform: translateY(0); }
    .cta-form button:focus-visible { outline: 2px solid #08063c; outline-offset: 3px; }
    .cta-members { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
    .cta-avatars { display: flex; }
    .cta-avatars span { display: inline-block; width: 32px; height: 32px; border-radius: 50%; border: none; margin-left: -9px; overflow: hidden; background-size: cover; background-position: center top; box-shadow: 0 1px 4px rgba(0,0,0,.12); flex-shrink: 0; }
    .cta-avatars span:first-child { margin-left: 0; }
    /* All four portraits are approximate decorative stock photos, not original CleanShot assets
       or verified community members. Exact originals and replacement URLs: assets/portrait-provenance.json. */
    .av1 { background-image: url('assets/avatar-1.jpeg'); }
    .av2 { background-image: url('assets/avatar-2.jpeg'); }
    .av3 { background-image: url('assets/avatar-3.jpeg'); }
    .av4 { background-image: url('assets/avatar-4.jpeg'); }
    .cta-members p { font-size: 12.5px; font-weight: 600; color: #08063c; margin: 0; }
    @media (max-width: 600px) {
      .cta-content { padding: 24px; max-width: 100%; }
      .cta-content h2 { font-size: 19px; }
      .cta-content p { font-size: 11.5px; max-width: 100%; margin-bottom: 16px; }
      .cta-form { flex-direction: column; gap: 8px; max-width: 100%; }
      .cta-form input, .cta-form button { width: 100%; text-align: center; }
      .cta-members { flex-wrap: wrap; gap: 8px; }
      .cta-avatars span { width: 28px; height: 28px; margin-left: -7px; }
      .cta-members p { margin: 0; }
    }
  </style>
</head>
<body>
  <section class="cta-section" aria-labelledby="community-title">
    <div class="cta-wrapper">
      <video class="cta-bg" autoplay muted loop playsinline aria-hidden="true">
        <source src="assets/background.mp4" type="video/mp4" />
      </video>
      <div class="cta-content">
        <h2 id="community-title">Subscribe to Our Community</h2>
        <p>Get exclusive access to cutting-edge tech insights, industry trends, and expert advice delivered straight to your inbox. Join our growing community today!</p>
        <div class="cta-form">
          <input type="email" placeholder="Enter your email here" aria-label="Email address" autocomplete="email" />
          <button type="button">Join Now</button>
        </div>
        <div class="cta-members">
          <div class="cta-avatars" aria-hidden="true">
            <span class="av1" title="Approximate decorative Unsplash portrait 1; not a verified community member"></span><span class="av2" title="Approximate decorative Unsplash portrait 2; not a verified community member"></span><span class="av3" title="Approximate decorative Unsplash portrait 3; not a verified community member"></span><span class="av4" title="Approximate decorative Unsplash portrait 4; not a verified community member"></span>
          </div>
          <p>5,000+ happy members</p>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
