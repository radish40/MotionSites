<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101211" />
    <meta name="description" content="An interactive call-to-action with a soft, cursor-following glow." />
    <title>Glow Cursor Button</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23181d19'/%3E%3Cpath d='M9 16h14m-6-6 6 6-6 6' fill='none' stroke='%23d6f5b7' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./main.js" defer></script>
  </head>
  <body>
    <main>
      <button class="glow-button" type="button" aria-label="Get started">
        <span class="button-label">Get started</span>
        <svg class="arrow" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4.75 12h14.5m-6-6 6 6-6 6" />
        </svg>
      </button>
      <span class="sr-only" role="status" aria-live="polite"></span>
    </main>
  </body>
</html>
