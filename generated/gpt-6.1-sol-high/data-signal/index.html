<script>
(()=>{
 const root=document.documentElement,header=document.querySelector('.header'),toggle=document.querySelector('.menu-toggle'),panel=document.querySelector('#tablet-navigation');
 document.querySelector('.demo-card').addEventListener('animationend',e=>{if(e.animationName==='entrance-card'){root.classList.remove('motion-pending');clearTimeout(window.entranceFallback);}});
 const isCompact=()=>getComputedStyle(toggle).display!=='none';
 function menu(open,restore=false){header.classList.toggle('menu-open',open);toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'Close menu':'Open menu');panel.inert=isCompact()&&!open;if(open){getComputedStyle(panel).visibility;panel.querySelector('a').focus();}else if(restore)toggle.focus();}
 toggle.addEventListener('click',()=>menu(!header.classList.contains('menu-open')));
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&header.classList.contains('menu-open'))menu(false,true);});
 document.addEventListener('pointerdown',e=>{if(!header.contains(e.target))menu(false);});
 panel.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>menu(false)));
 window.addEventListener('resize',()=>menu(false));menu(false);
 const bg=document.querySelector('.background'),motion=matchMedia('(prefers-reduced-motion: reduce)');
 function respectMotion(){if(motion.matches){bg.pause();root.classList.remove('motion-pending');clearTimeout(window.entranceFallback);}else bg.play().catch(()=>{});}
 bg.addEventListener('loadeddata',respectMotion,{once:true});motion.addEventListener('change',respectMotion);
 const dialog=document.querySelector('.demo-dialog'),demo=dialog.querySelector('video');let opener;
 function openDemo(e){opener=e.currentTarget;menu(false);dialog.showModal();bg.pause();demo.currentTime=0;demo.play().catch(()=>{});}
 document.querySelector('.play').addEventListener('click',openDemo);document.querySelector('.watch-button').addEventListener('click',openDemo);
 dialog.querySelector('.close-demo').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
 dialog.addEventListener('close',()=>{demo.pause();respectMotion();opener?.focus();});
 // Integration hooks: no destination or signup service was supplied in PROMPT.md.
 document.querySelector('.sign-up').addEventListener('click',()=>window.dispatchEvent(new CustomEvent('vantage:signup')));
 document.querySelector('.primary-cta').addEventListener('click',()=>window.dispatchEvent(new CustomEvent('vantage:get-started')));
})();
</script>
