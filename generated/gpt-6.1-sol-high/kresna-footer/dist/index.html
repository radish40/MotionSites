<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Kresna — Smarter sales automation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #ffffff; padding: 48px 24px; font-family: 'DM Sans', sans-serif; color: #2d3148; }
    .footer-wrapper { max-width: 1150px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 16px; align-items: stretch; position: relative; z-index: 1; }
    .footer-left { position: relative; min-height: 340px; border-radius: 28px; padding: 32px; overflow: hidden; box-shadow: 0 12px 40px rgba(21,76,189,.25); background: #1e4fc0; display: flex; flex-direction: column; justify-content: space-between; }
    .footer-left-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; pointer-events: none; }
    .footer-logo { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
    .footer-logo-mark { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,.15); border: 1.5px solid rgba(255,255,255,.85); display: grid; place-items: center; font-size: 16px; font-weight: 700; color: white; letter-spacing: -.02em; }
    .footer-logo-name { font-size: 22px; font-weight: 700; color: white; letter-spacing: -.02em; }
    .footer-tagline-container { position: relative; margin-top: auto; margin-bottom: 28px; z-index: 1; }
    .footer-tagline { font-size: 19px; font-weight: 400; color: white; line-height: 1.45; }
    .footer-tagline span { color: rgba(255,255,255,.65); }
    .footer-social-row { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 1; }
    .footer-social-label { font-family: 'Caveat', cursive; font-size: 17px; font-weight: 600; color: rgba(255,255,255,.9); letter-spacing: .3px; white-space: nowrap; }
    .footer-social-icons { display: flex; gap: 7px; }
    .social-icon { width: 36px; height: 36px; border-radius: 9px; background: #0e1014; box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.2); transition: background .2s, transform .15s, box-shadow .2s; }
    .social-icon a { display: grid; place-items: center; width: 100%; height: 100%; border-radius: inherit; color: white; }
    .social-icon svg { width: 15px; height: 15px; fill: currentColor; }
    .social-icon:hover { background: #000; transform: translateY(-2px); box-shadow: 0 9px 22px rgba(0,0,0,.45), 0 3px 8px rgba(0,0,0,.25); }
    .footer-right { min-width: 0; background: #f0f1f5; border-radius: 28px; padding: 40px; overflow: visible; box-shadow: 0 4px 20px rgba(0,0,0,.04); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .footer-lucky-graphic { position: absolute; top: -36px; right: 40px; z-index: 10; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .lucky-cube { width: 96px; height: 96px; border-radius: 22px; transform: rotate(-10deg); background: linear-gradient(135deg,#5b9ffb 0%,#1e5dd7 55%,#1448be 100%); box-shadow: inset 3px 3px 8px rgba(255,255,255,.35), inset -3px -3px 12px rgba(0,0,0,.18), 8px 14px 28px rgba(20,72,200,.35); display: grid; place-items: center; }
    .lucky-cube-mark { font-size: 42px; font-weight: 700; color: white; letter-spacing: -.04em; transform: rotate(10deg); text-shadow: 0 3px 6px rgba(0,0,0,.25); line-height: 1; }
    .lucky-text-row { display: flex; gap: 6px; align-items: center; transform: rotate(-4deg); margin-top: 4px; }
    .lucky-arrow { width: 22px; height: 22px; color: #9ca3af; }
    .lucky-arrow path { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .lucky-text { font-family: 'Caveat', cursive; font-size: 20px; font-weight: 600; color: #9ca3af; white-space: nowrap; }
    .footer-nav-cols { display: flex; gap: 72px; padding-top: 8px; }
    .footer-col-title { font-family: 'Caveat', cursive; font-size: 24px; font-weight: 600; font-style: italic; color: #9ca3af; margin-bottom: 18px; }
    .footer-col a { display: block; font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 14px; text-decoration: none; transition: color .2s; }
    .footer-col a:hover { color: #1f65d6; }
    .footer-bottom { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 48px; gap: 16px; }
    .footer-copyright { font-size: 12.5px; font-weight: 500; color: #9ca3af; }
    .footer-cta-mini { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .footer-cta-mini h4 { font-size: 15px; font-weight: 400; color: #6b7280; line-height: 1.45; }
    .footer-cta-mini strong { display: block; font-size: 19px; font-weight: 700; color: #111827; }
    .footer-subscribe-row { display: flex; width: 310px; max-width: 100%; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 5px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
    .footer-subscribe-row input { width: 0; min-width: 0; flex: 1; padding: 11px 14px; background: transparent; border: none; font-family: inherit; font-size: 13.5px; color: #111827; border-radius: 8px; }
    .footer-subscribe-row input::placeholder { color: #9ca3af; }
    .footer-subscribe-row button { padding: 11px 22px; background: #111214; color: white; font-family: inherit; font-size: 13.5px; font-weight: 600; border: none; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.15); cursor: pointer; transition: background .2s, box-shadow .2s, transform .15s; }
    .footer-subscribe-row button:hover { background: #000; box-shadow: 0 9px 24px rgba(0,0,0,.35), 0 3px 10px rgba(0,0,0,.2); transform: translateY(-1px); }
    :focus-visible { outline: 2px solid #1f65d6; outline-offset: 4px; }
    .subscribe-status { font-size: 12px; line-height: 1.5; color: #6b7280; max-width: 310px; }
    .subscribe-status:empty { display: none; }
    .footer-watermark { max-width: 1150px; margin: -60px auto 0; pointer-events: none; user-select: none; position: relative; z-index: 0; line-height: 0; }
    .footer-watermark svg { display: block; width: 100%; height: auto; overflow: visible; }
    .footer-watermark text { font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -.03em; fill: rgba(0,0,0,.04); }
    @media (max-width: 860px) {
      .footer-wrapper { grid-template-columns: 1fr; }
      .footer-left { min-height: auto; gap: 40px; }
    }
    @media (max-width: 560px) {
      .footer-right { padding: 24px; }
      .footer-nav-cols { gap: 40px; }
      .footer-bottom { flex-direction: column; align-items: flex-start; gap: 24px; }
      .footer-cta-mini { width: 100%; }
      .footer-subscribe-row { width: 100%; }
      .footer-lucky-graphic { right: 12px; top: -28px; }
      .lucky-cube { width: 72px; height: 72px; }
      .lucky-cube-mark { font-size: 31.5px; }
      .footer-social-row { gap: 8px; }
      .footer-social-icons { gap: 5px; }
      .footer-social-label { white-space: normal; }
    }
  </style>
</head>

        <div class="footer-cta-mini">
          <h4>AI moves fast.<br><strong>Stay ahead with Kresna.</strong></h4>
          <div class="footer-subscribe-row"><input type="email" placeholder="Enter email address" aria-label="Email address" required autocomplete="email"><button type="button">Subscribe</button></div>

        </div>
      </div>

  </div>
  <div class="footer-watermark" aria-hidden="true"><svg id="watermarkSvg" viewBox="62 95 876 175" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><text id="watermarkText" x="500" y="240" text-anchor="middle" font-size="320">Kresna</text></svg></div>
  <script>
    function fitWatermark() {
      const svg = document.getElementById('watermarkSvg');
      const text = document.getElementById('watermarkText');
      if (!svg || !text) return;
      try {
        const bbox = text.getBBox();
        svg.setAttribute('viewBox', `${bbox.x} ${bbox.y} ${bbox.width} ${bbox.height}`);
      } catch (e) {}
    }
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fitWatermark);
    } else {
      window.addEventListener('load', fitWatermark);
    }
    window.addEventListener('resize', fitWatermark);
    const email = document.querySelector('.footer-subscribe-row input');
    const subscribe = document.querySelector('.footer-subscribe-row button');
    function checkSubscription() {
      if (!email.reportValidity()) return;
      document.querySelector('.subscribe-status').textContent = 'Subscription service is not connected yet.';
    }
    subscribe.addEventListener('click', checkSubscription);
    email.addEventListener('keydown', event => {
      if (event.key === 'Enter') { event.preventDefault(); checkSubscription(); }
    });
  </script>
