<!doctype html>
<html lang="en">
<head>

  <title>Logoisum — Video Editing Agency</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

<body>
  <main class="hero" id="home">
    <video class="landscape" autoplay muted loop playsinline preload="auto" aria-hidden="true"><source src="/assets/landscape.mp4" type="video/mp4" /></video>
    <header class="navigation">

      <nav class="desktop-links" aria-label="Main navigation"><a href="#about" data-panel="about">About</a><a href="#works" data-panel="works">Works</a><a href="#services" data-panel="services">Services</a><a href="#testimonial" data-panel="testimonial">Testimonial</a></nav>
      <button class="meeting-button" data-panel="meeting">Book A Free Meeting <span class="arrow-circle"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12" stroke="currentColor" stroke-width="1.6"/></svg></span></button>
      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu"><span></span><span></span></button>

      <h1 id="headline"><span class="headline-sans">Agency that makes your</span><span class="headline-serif">videos &amp; reels viral</span></h1>
      <p>Short-form video editing for Influencers, Creators and Brands</p>
      <button class="workreel-button" data-panel="works"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3.8a.8.8 0 0 1 1.2-.7l9.2 6.2a.8.8 0 0 1 0 1.4l-9.2 6.2a.8.8 0 0 1-1.2-.7Z" fill="currentColor"/></svg>See Our Workreel</button>

  <dialog class="panel" aria-labelledby="panel-title"><button class="close-panel" aria-label="Close dialog">×</button><div id="panel-content"></div></dialog>
  <script type="module" src="/src.js"></script>
