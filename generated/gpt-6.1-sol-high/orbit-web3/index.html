<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f0c" />
    <meta name="description" content="Own the future of your assets. Launch your orbit." />
    <title>Orbit Web3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="page">
      <video class="background-video" autoplay muted loop playsinline aria-hidden="true">
        <source src="/assets/orbit.mp4" type="video/mp4" />
      </video>
      <div class="content">
        <header class="navbar">
          <a class="brand" href="#" aria-label="Orbit home">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M8 10L14 30L20 16L26 30L32 10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </a>
          <nav aria-label="Main navigation">
            <a href="#vault">Vault</a>
            <a href="#send">Send</a>
            <a href="#receive">Receive</a>
            <a href="#trade">Trade</a>
          </nav>
        </header>
        <main>
          <div class="hero">
            <h1>Own the future of<br />your <span class="glow-word">assets.<span class="glow glow-soft" aria-hidden="true">assets.</span><span class="glow glow-wide" aria-hidden="true">assets.</span></span></h1>
            <button class="launch" type="button"><span class="button-blob" aria-hidden="true"></span><span class="button-label">Launch your orbit</span></button>
          </div>
          <section class="builders" aria-label="Trusted builders">
            <p>Trusted by top builders</p>
            <div class="marquee-window">
              <div class="marquee-track">
                <div class="logo-group">
                  <div class="builder"><i data-lucide="sun"></i><span>Nebulon</span></div>
                  <div class="builder"><i data-lucide="box"></i><span>Prismify</span></div>
                  <div class="builder"><i data-lucide="star"></i><span>Nova Labs</span></div>
                  <div class="builder"><i data-lucide="feather"></i><span>Zephyr</span></div>
                  <div class="builder"><i data-lucide="sparkles"></i><span>Ignite</span></div>
                </div>
                <div class="logo-group" aria-hidden="true">
                  <div class="builder"><i data-lucide="sun"></i><span>Nebulon</span></div>
                  <div class="builder"><i data-lucide="box"></i><span>Prismify</span></div>
                  <div class="builder"><i data-lucide="star"></i><span>Nova Labs</span></div>
                  <div class="builder"><i data-lucide="feather"></i><span>Zephyr</span></div>
                  <div class="builder"><i data-lucide="sparkles"></i><span>Ignite</span></div>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
