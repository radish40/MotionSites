<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f4">
  <title>Place Saver</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2314151d'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='46' fill='white' font-family='serif'%3Ep%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./assets/google-fonts.css">
  <link rel="preload" href="./assets/garamond-light.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="status-icons" viewBox="0 0 74 16"><g fill="white"><rect x="0" y="10" width="3" height="5" rx=".8"/><rect x="5" y="7" width="3" height="8" rx=".8"/><rect x="10" y="4" width="3" height="11" rx=".8"/><rect x="15" y="1" width="3" height="14" rx=".8"/></g><g fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"><path d="M25 5a12 12 0 0 1 17 0M28 8a8 8 0 0 1 11 0M31 11a3.5 3.5 0 0 1 5 0"/></g><circle cx="33.5" cy="14" r="1.1" fill="white"/><rect x="49" y="2" width="22" height="12" rx="3" stroke="white" stroke-opacity=".55" fill="none"/><rect x="51" y="4" width="18" height="8" rx="1.3" fill="white"/><path d="M73 6v4" stroke="white" stroke-opacity=".6" stroke-width="2"/></symbol>
    <symbol id="apple" viewBox="0 0 18 21"><path fill="currentColor" d="M14.9 11.2c0-2 1.6-3 1.7-3.1-1-1.4-2.4-1.6-3-1.6-1.3-.1-2.5.8-3.1.8-.6 0-1.6-.8-2.7-.8C6.4 6.5 5 7.4 4.2 8.7c-1.5 2.7-.4 6.8 1.1 9 .7 1.1 1.5 2.2 2.6 2.2 1.1-.1 1.5-.7 2.9-.7s1.8.7 3 .7 1.9-1 2.6-2.1c.8-1.2 1.2-2.4 1.2-2.5-.1 0-2.7-1-2.7-4.1ZM12.8 5c.6-.8 1.1-1.9 1-3-.9.1-2 .6-2.7 1.4-.6.7-1.2 1.8-1.1 2.9 1 .1 2.1-.5 2.8-1.3Z" transform="translate(-1 -1)"/></symbol>
  </defs></svg>
  <main class="viewport" aria-label="Place Saver app showcase">
    <div class="stage">
      <section class="phone phone-light" aria-label="Welcome to Place Saver">
        <div class="welcome-design">
          <video class="hero-video animate background" autoplay loop muted playsinline preload="auto" aria-label="Atmospheric view of a glowing planet"><source src="./assets/hero.mp4" type="video/mp4"></video>
          <div class="hero-fade"></div>
          <img class="logo animate drop" src="./assets/logo.png" width="118" alt="Place Saver" style="--delay:.45s">
          <h1 class="welcome-title animate reveal" style="--delay:.62s">The place for all<br><em>your places</em></h1>
          <p class="subtitle animate reveal" style="--delay:.78s">Save, Organize and Share<br>your favorite places</p>
          <button class="apple-button animate reveal" style="--delay:.94s" id="continue"><svg width="18" height="21" aria-hidden="true"><use href="#apple"/></svg>Continue with Apple</button>
          <p class="terms animate reveal" style="--delay:1.06s">By continuing, you agree to <button id="terms">Terms of Use</button></p>
        </div>
        <div class="status-bar" aria-hidden="true"><span>11:11</span><svg><use href="#status-icons"/></svg></div>
        <div class="island" aria-hidden="true"></div><div class="home-indicator" aria-hidden="true"></div>
      </section>
      <section class="phone phone-dark" aria-label="Unlock Pro subscription">
        <video class="pro-video animate background" style="--delay:.12s" autoplay loop muted playsinline preload="auto" aria-label="Atmospheric view of Earth"><source src="./assets/pro.mp4" type="video/mp4"></video>
        <div class="pro-fade"></div>
        <h2 class="pro-title animate reveal" style="--delay:.58s">Unlock Pro:</h2>
        <div class="divider animate line" style="--delay:.72s"></div>
        <ul class="features">
          <li class="animate reveal" style="--delay:.80s"><svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5Z M2 12l10 5 10-5 M2 17l10 5 10-5"/></svg><span>Create private Guides</span></li>
          <li class="animate reveal" style="--delay:.88s"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg><span>Import from social media</span></li>
          <li class="animate reveal" style="--delay:.96s"><svg viewBox="-1 0 26 24"><path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.988-8-13.083-8-5.096 0-5.096 8 0 8 5.095 0 7.988-8 13.083-8z"/></svg><span>Unlimited Guides</span></li>
          <li class="animate reveal" style="--delay:1.04s"><svg viewBox="0 0 24 24"><path d="M12 3c.4 3.6 1.4 4.6 5 5-3.6.4-4.6 1.4-5 5-.4-3.6-1.4-4.6-5-5 3.6-.4 4.6-1.4 5-5Z"/></svg><span>AI search</span></li>
          <li class="animate reveal" style="--delay:1.12s"><svg viewBox="0 0 24 24"><circle cx="8.5" cy="8" r="3"/><path d="M2.5 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M17 14a5 5 0 0 1 4.5 5v2"/></svg><span>Collaborate with friends</span></li>
        </ul>
        <div class="pricing" role="group" aria-label="Subscription billing plan">
          <button class="plan monthly selected animate reveal" style="--delay:1.22s" aria-pressed="true" data-plan="Monthly"><span class="plan-label">Monthly</span><span class="price">$20</span><span class="billing">Billed Monthly</span></button>
          <button class="plan yearly animate reveal" style="--delay:1.30s" aria-pressed="false" data-plan="Yearly"><span class="plan-label">Yearly</span><span class="price">$200</span><span class="save animate pop" style="--delay:1.55s">Save $40.00</span><span class="billing">Billed Yearly</span></button>
        </div>
        <button class="subscribe animate reveal" style="--delay:1.42s" id="subscribe">Subscribe<svg width="9" height="15" viewBox="0 0 9 15" aria-hidden="true"><path d="M1.5 1.5 7 7.5 1.5 13.5"/></svg></button>
        <div class="status-bar" aria-hidden="true"><span>11:11</span><svg><use href="#status-icons"/></svg></div>
        <div class="island" aria-hidden="true"></div><div class="home-indicator" aria-hidden="true"></div>
      </section>
    </div>
  </main>
  <dialog aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-copy"></p><button id="close-dialog">Got it</button></dialog>
</body>
</html>
