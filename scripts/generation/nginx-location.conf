location = /motionsites-results { return 301 /motionsites-results/; }
location ^~ /motionsites-results/global-cta-footer/ {
    root /var/www/certbot;
    index index.html;
    autoindex off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header Cache-Control "no-cache, no-transform" always;
    try_files $uri $uri/ =404;
}
location ^~ /motionsites-results/glitch-pulse/preview/ {
    root /var/www/certbot;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-transform" always;
    try_files $uri =404;
}
location ^~ /motionsites-results/glitch-pulse/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $motionsites_glitch_backend motionsites-glitch-pulse:3000;
    proxy_pass http://$motionsites_glitch_backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache, no-transform" always;
}
location = /motionsites-results/oyla/api/higgsfield-video {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $motionsites_oyla_backend motionsites-oyla:3000;
    proxy_pass http://$motionsites_oyla_backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /motionsites-results/.releases/ { return 404; }
location ^~ /motionsites-results/nimbus-grid/ {
    root /var/www/certbot;
    index index.html;
    autoindex off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-src https://fragcoord.xyz; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache, no-transform" always;
    try_files $uri $uri/ =404;
}
